services:
  fss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fss-holdem-bot
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
